name: CI/CD

# dev  -> ghcr.io/so1mock/coblocks-frontend:dev   -> NAS coblocks-dev  스택
# main -> ghcr.io/so1mock/coblocks-frontend:main  -> NAS coblocks-prod 스택
#
# 이미지는 환경에 의존하지 않는다. API 주소는 상대경로(/api/v1)이고
# OAuth redirect_uri 는 브라우저에서 window.location.origin 으로 계산하므로,
# 같은 내용의 이미지를 dev / prod 양쪽에 그대로 배포할 수 있다.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/coblocks-frontend

jobs:
  image:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 결정
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: 빌드 (+ 푸시)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_API_BASEURL 은 Dockerfile 기본값(/api/v1)을 그대로 쓴다.
          # 아래 둘은 공개 정보이며, 비어 있으면 소셜 로그인 버튼만 동작하지 않는다.
          build-args: |
            VITE_AUTHORIZATION_URL=${{ secrets.VITE_AUTHORIZATION_URL }}
            VITE_CLIENT_ID=${{ secrets.VITE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
