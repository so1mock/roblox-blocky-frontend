name: CI/CD

# dev  -> ghcr.io/so1mock/coblocks-frontend:dev   -> NAS coblocks-dev  스택
# main -> ghcr.io/so1mock/coblocks-frontend:main  -> NAS coblocks-prod 스택
#
# 이미지는 환경에 의존하지 않는다. API 주소는 상대경로(/api/v1)이고
# OAuth redirect_uri 는 브라우저에서 window.location.origin 으로 계산하므로,
# 같은 내용의 이미지를 dev / prod 양쪽에 그대로 배포할 수 있다.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/coblocks-frontend

jobs:
  image:
    name: 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 결정
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: 빌드 (+ 푸시)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_API_BASEURL 은 Dockerfile 기본값(/api/v1)을 그대로 쓴다.
          # Client ID 는 Roblox 앱을 dev/prod 로 나눠 등록했으므로 브랜치에 따라
          # 다른 값을 넣는다. 브라우저 번들에 노출되는 공개 정보이며,
          # 비밀에 해당하는 Client Secret 은 백엔드(.env)에서만 다룬다.
          build-args: |
            VITE_AUTHORIZATION_URL=${{ secrets.VITE_AUTHORIZATION_URL }}
            VITE_CLIENT_ID=${{ github.ref_name == 'main' && secrets.VITE_CLIENT_ID_PROD || secrets.VITE_CLIENT_ID_DEV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: NAS 배포
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 같은 스택에 배포가 겹치지 않게 직렬화한다.
    concurrency:
      group: nas-deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: NAS에서 이미지 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          port: ${{ secrets.NAS_PORT }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          # sudo 는 /etc/sudoers.d/coblocks-deploy 에서 docker, docker-compose
          # 두 실행 파일에만 NOPASSWD 로 허용되어 있다. 규칙과 정확히 일치하도록
          # 절대 경로로 호출한다 (비대화형 셸은 PATH 가 다를 수 있다).
          script: |
            set -e
            DIR=/volume1/docker/coblocks-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
            if [ ! -d "$DIR" ]; then
              echo "::error::$DIR 가 없습니다. 해당 스택을 먼저 구성해야 합니다."
              exit 1
            fi
            cd "$DIR"
            sudo /usr/local/bin/docker-compose pull
            sudo /usr/local/bin/docker-compose up -d
            sudo /usr/local/bin/docker-compose ps
