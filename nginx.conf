# 프론트엔드 컨테이너의 nginx — 정적 파일 서빙 전용
#
# 외부 요청은 게이트웨이(coblock-infra 의 docker/gateway.conf)를 거쳐 들어온다.
# 경로별 라우팅은 전부 게이트웨이가 하고, 이 컨테이너는 파일만 내준다.
#
#   DSM nginx (TLS) → gateway ─┬─ /api/ → backend
#                              └─ /     → 여기
#
# 전에는 이 파일에 /api/ 프록시가 있었다. 그러면 백엔드 경로를 하나 추가할 때마다
# 프론트엔드 이미지를 다시 빌드해야 해서 게이트웨이로 분리했다 (COBLOCKS-42).
# 여기에 다시 프록시를 넣지 말 것 — 게이트웨이가 먼저 가로채므로 닿지도 않는다.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅 지원 (모든 요청을 index.html로)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
